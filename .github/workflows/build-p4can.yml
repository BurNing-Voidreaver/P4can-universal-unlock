name: build-p4can

on:
  workflow_dispatch:
    inputs:
      embed_dashboard:
        description: "Regenerate index_html.h from dashboard_source.html first"
        type: boolean
        default: false
  push:
    branches: [main, master]
    paths:
      - "**.ino"
      - "**.h"
      - "**.c"
      - "src/**"
      - "third_party/**"
      - "tools/**"
      - "dashboard_source.html"
      - ".github/workflows/build-p4can.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      # Same configuration the shipped v3.29.3 image was built with (its header records DIO).
      FQBN: esp32:esp32:esp32p4:ChipVariant=postv3,FlashSize=32M,PartitionScheme=app5M_fat24M_32MB,PSRAM=enabled,USBMode=hwcdc,CDCOnBoot=cdc,FlashMode=dio

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install arduino-cli
        run: |
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | BINDIR=/usr/local/bin sh
          arduino-cli version

      - name: Cache Arduino15 (ESP32 core)
        uses: actions/cache@v4
        with:
          path: ~/.arduino15
          key: arduino15-esp32-3.3.12-${{ runner.os }}
          restore-keys: |
            arduino15-esp32-3.3.12-

      - name: Install ESP32 core 3.3.12
        run: |
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.3.12
          arduino-cli core list

      - name: Prepare sketch (folder name must equal .ino name)
        id: prep
        run: |
          set -euo pipefail
          INO=$(find . -maxdepth 3 -name '*.ino' -not -path './.git/*' -print -quit)
          test -n "$INO" || { echo "no .ino found"; exit 1; }
          SRC=$(dirname "$INO")
          NAME=$(basename "$INO" .ino)
          DEST="$RUNNER_TEMP/sketch/$NAME"
          echo "sketch: $SRC  ->  $DEST"
          rm -rf "$RUNNER_TEMP/sketch"
          mkdir -p "$DEST"
          tar --exclude=.git --exclude=.github -cf - -C "$SRC" . | tar -xf - -C "$DEST"
          ls "$DEST"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "dir=$DEST" >> "$GITHUB_OUTPUT"

      - name: Regenerate dashboard header (optional)
        if: ${{ inputs.embed_dashboard }}
        run: |
          cd "${{ steps.prep.outputs.dir }}"
          python3 tools/embed_dashboard.py

      - name: Compile
        run: |
          set -euo pipefail
          SKETCH='${{ steps.prep.outputs.dir }}'
          TC="$SKETCH/third_party/tinycrypt/include"
          arduino-cli compile --fqbn "$FQBN" --warnings default \
            --build-property "compiler.c.extra_flags=-I$TC" \
            --build-property "compiler.cpp.extra_flags=-I$TC" \
            --build-path out/build --output-dir out "$SKETCH"
          ls -l out

      - name: Check NimBLE -> fixed TinyCrypt ownership
        continue-on-error: true
        run: |
          MAP=$(find out/build -maxdepth 1 -name '*.ino.map' -print -quit)
          echo "map: $MAP"
          grep -E 'uECC_shared_secret|EccPoint_mult|uECC_make_key|uECC_valid_public_key' "$MAP" || true
          if grep 'uECC_shared_secret' "$MAP" | grep -q 'src/p4_tinycrypt/'; then
            echo "OK: package TinyCrypt objects are linked"
          else
            echo "WARN: uECC_shared_secret not owned by src/p4_tinycrypt"
          fi

      - name: Merge 32MB fullflash image
        run: |
          set -o pipefail
          LOG=$(mktemp)
          merge() {
            python3 -m pip --version || true
            python3 -m pip install --quiet --user "esptool==5.6.0" || true
            python3 -m pip install --quiet --user --break-system-packages "esptool==5.6.0" || true
            python3 -m esptool version
            echo "== out/build =="
            find out/build -maxdepth 1 \( -name '*.bin' -o -name '*.elf' -o -name '*.map' \) | sort
            echo "== out =="
            find out -maxdepth 1 -type f | sort
            BOOT=$(find out -maxdepth 2 -name '*.bootloader.bin' -print -quit)
            PART=$(find out -maxdepth 2 -name '*.partitions.bin' -print -quit)
            APP=$(find out -maxdepth 2 -name '*.ino.bin' -print -quit)
            for f in "$BOOT" "$PART" "$APP"; do
              echo "found: $f"
              test -f "$f" || return 1
            done
            if python3 -m esptool merge-bin --help >/dev/null 2>&1; then CMD=merge-bin; else CMD=merge_bin; fi
            echo "esptool subcommand: $CMD"
            python3 -m esptool "$CMD" -o out/fullflash.bin --flash-mode dio --flash-freq 80m --flash-size 32MB 0x2000 "$BOOT" 0x8000 "$PART" 0x10000 "$APP"
            ls -l out/fullflash.bin
            python3 -m esptool image-info "$APP" || true
          }
          if merge 2>&1 | tee "$LOG"; then
            echo "merge OK"
          else
            MSG=$(tail -c 700 "$LOG")
            MSG=${MSG//$'\n'/|}
            echo "::error::merge failed: $MSG"
            exit 1
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: p4can-firmware
          if-no-files-found: error
          retention-days: 14
          path: |
            out/fullflash.bin
            out/build/*.ino.bin
            out/build/*.ino.bootloader.bin
            out/build/*.ino.partitions.bin
            out/build/*.ino.elf
            out/build/*.ino.map
