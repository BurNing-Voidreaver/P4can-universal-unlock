name: build-p4can

on:
  workflow_dispatch:
    inputs:
      embed_dashboard:
        description: "Regenerate index_html.h from dashboard_source.html first"
        type: boolean
        default: false
  push:
    branches: [main, master]
    paths:
      - "**.ino"
      - "**.h"
      - "**.c"
      - "src/**"
      - "third_party/**"
      - "tools/**"
      - "dashboard_source.html"
      - ".github/workflows/build-p4can.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      # FlashMode=qio is what the shipped v3.29.3 image used: the bootloader is the
      # QIO-capable one (build.boot=qio) even though the image header still says DIO.
      FQBN: esp32:esp32:esp32p4:ChipVariant=postv3,FlashSize=32M,PartitionScheme=app5M_fat24M_32MB,PSRAM=enabled,USBMode=hwcdc,CDCOnBoot=cdc,FlashMode=qio

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install arduino-cli
        run: |
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | BINDIR=/usr/local/bin sh
          arduino-cli version

      - name: Cache Arduino15 (ESP32 core)
        uses: actions/cache@v4
        with:
          path: ~/.arduino15
          key: arduino15-esp32-3.3.12-${{ runner.os }}
          restore-keys: |
            arduino15-esp32-3.3.12-

      - name: Install ESP32 core 3.3.12
        run: |
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.3.12
          arduino-cli core list

      - name: Prepare sketch (folder name must equal .ino name)
        id: prep
        run: |
          set -euo pipefail
          INO=$(find . -maxdepth 3 -name '*.ino' -not -path './.git/*' -print -quit)
          test -n "$INO" || { echo "no .ino found"; exit 1; }
          SRC=$(dirname "$INO")
          NAME=$(basename "$INO" .ino)
          DEST="$RUNNER_TEMP/sketch/$NAME"
          echo "sketch: $SRC  ->  $DEST"
          rm -rf "$RUNNER_TEMP/sketch"
          mkdir -p "$DEST"
          tar --exclude=.git --exclude=.github -cf - -C "$SRC" . | tar -xf - -C "$DEST"
          ls "$DEST"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "dir=$DEST" >> "$GITHUB_OUTPUT"

      - name: Regenerate dashboard header (optional)
        if: ${{ inputs.embed_dashboard }}
        run: |
          cd "${{ steps.prep.outputs.dir }}"
          python3 tools/embed_dashboard.py

      - name: Compile
        run: |
          set -euo pipefail
          SKETCH='${{ steps.prep.outputs.dir }}'
          TC="$SKETCH/third_party/tinycrypt/include"
          arduino-cli compile --fqbn "$FQBN" --warnings default \
            --build-property "compiler.c.extra_flags=-I$TC" \
            --build-property "compiler.cpp.extra_flags=-I$TC" \
            --build-path out/build --output-dir out "$SKETCH"
          find out -maxdepth 1 -type f | sort

      - name: Verify embedded dashboard
        run: |
          set -euo pipefail
          APP=$(find out -maxdepth 2 -name '*.ino.bin' -print -quit)
          python3 - "$APP" "$GITHUB_WORKSPACE/dashboard_source.html" <<'PY'
          import hashlib
          import sys
          import zlib

          app, src = sys.argv[1], sys.argv[2]
          data = open(app, 'rb').read()
          magic = bytes([0x1f, 0x8b, 0x08, 0x00, 0x00, 0x00, 0x00, 0x00, 0x02, 0xff])
          idx = data.find(magic)
          if idx < 0:
              print('::error::no gzip stream found in app image')
              raise SystemExit(1)
          html = zlib.decompressobj(16 + zlib.MAX_WBITS).decompress(data[idx:])
          want = open(src, 'rb').read()
          digest = hashlib.sha256(html).hexdigest()
          print('embedded html : %d bytes sha256=%s' % (len(html), digest))
          print('source        : %d bytes sha256=%s' % (len(want), hashlib.sha256(want).hexdigest()))
          print('match: %s' % (html == want))
          print('::notice title=embedded-dashboard::%d bytes sha256=%s match=%s' % (len(html), digest, html == want))
          if html != want:
              raise SystemExit(1)
          PY

      - name: Check NimBLE -> fixed TinyCrypt ownership
        continue-on-error: true
        run: |
          MAP=$(find out/build -maxdepth 1 -name '*.ino.map' -print -quit)
          echo "map: $MAP"
          grep -E 'uECC_shared_secret|EccPoint_mult|uECC_make_key|uECC_valid_public_key' "$MAP" || true
          if grep 'uECC_shared_secret' "$MAP" | grep -q 'src/p4_tinycrypt/'; then
            echo "OK: package TinyCrypt objects are linked"
          else
            echo "WARN: uECC_shared_secret not owned by src/p4_tinycrypt"
          fi

      - name: Merge 32MB fullflash image
        run: |
          set -euo pipefail
          BOOT=$(find out -maxdepth 2 -name '*.bootloader.bin' -print -quit)
          PART=$(find out -maxdepth 2 -name '*.partitions.bin' -print -quit)
          APP=$(find out -maxdepth 2 -name '*.ino.bin' -print -quit)
          for f in "$BOOT" "$PART" "$APP"; do
            echo "found: $f ($(stat -c %s "$f") bytes)"
            test -s "$f"
          done
          BOOTAPP0=$(find "$HOME/.arduino15/packages/esp32/hardware" -name 'boot_app0.bin' -print -quit || true)
          echo "boot_app0: ${BOOTAPP0:-not found}"
          python3 - "$BOOT" "$PART" "$APP" "$BOOTAPP0" <<'PY'
          import os
          import sys
          boot, part, app = sys.argv[1:4]
          boot_app0 = sys.argv[4] if len(sys.argv) > 4 else ''
          SIZE = 32 * 1024 * 1024
          img = bytearray(bytes([255]) * SIZE)
          items = [(boot, 0x2000), (part, 0x8000), (app, 0x10000)]
          if boot_app0 and os.path.isfile(boot_app0):
              items.insert(2, (boot_app0, 0xe000))
          for path, off in items:
              data = open(path, 'rb').read()
              img[off:off + len(data)] = data
              print('%-72s -> 0x%08x  %d bytes' % (path, off, len(data)))
          with open('out/fullflash.bin', 'wb') as fh:
              fh.write(img)
          print('fullflash: %d bytes' % SIZE)
          PY
          ls -l out/fullflash.bin

      - name: Assert artifacts
        run: |
          set -euo pipefail
          test -s out/fullflash.bin
          APP=$(find out -maxdepth 2 -name '*.ino.bin' -print -quit)
          test -s "$APP"
          echo "app      : $APP  $(stat -c %s "$APP") bytes"
          echo "fullflash: out/fullflash.bin  $(stat -c %s out/fullflash.bin) bytes"

      - name: Report hashes
        run: |
          for f in out/fullflash.bin out/build/*.bootloader.bin out/build/*.partitions.bin out/build/*.ino.bin out/build/*.ino.elf; do
            [ -f "$f" ] || continue
            S=$(stat -c %s "$f")
            H=$(sha256sum "$f" | cut -d' ' -f1)
            echo "$(basename "$f")  $S bytes  $H"
            echo "::notice title=$(basename "$f")::$S bytes sha256=$H"
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: p4can-firmware
          if-no-files-found: error
          retention-days: 14
          path: |
            out/fullflash.bin
            out/build/*.ino.bin
            out/build/*.ino.bootloader.bin
            out/build/*.ino.partitions.bin
            out/build/*.ino.elf
            out/build/*.ino.map
